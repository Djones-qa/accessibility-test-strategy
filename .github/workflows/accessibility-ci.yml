name: Accessibility CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Job 1: TypeScript type check
  # ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  # ─────────────────────────────────────────────
  # Job 2: jest-axe unit tests
  # ─────────────────────────────────────────────
  unit-a11y:
    name: Unit Accessibility Tests (jest-axe)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run jest-axe unit tests
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Playwright E2E axe tests
  # ─────────────────────────────────────────────
  e2e-a11y:
    name: E2E Accessibility Tests (Playwright + axe)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Start static server
        run: npx serve -s public -l 3000 &
        env:
          CI: true

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 15000

      - name: Run Playwright accessibility tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: Pa11y CLI audit
  # ─────────────────────────────────────────────
  pa11y-audit:
    name: Pa11y WCAG 2.1 AA Audit
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start static server
        run: npx serve -s public -l 3000 &
        env:
          CI: true

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 15000

      - name: Run Pa11y audit
        run: npm run test:pa11y

      - name: Upload Pa11y reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-reports
          path: pa11y-reports/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 5: Accessibility gate summary
  # ─────────────────────────────────────────────
  a11y-gate:
    name: Accessibility Gate
    runs-on: ubuntu-latest
    needs: [unit-a11y, e2e-a11y, pa11y-audit]
    if: always()
    steps:
      - name: Check all accessibility jobs passed
        run: |
          if [[ "${{ needs.unit-a11y.result }}" != "success" || \
                "${{ needs.e2e-a11y.result }}" != "success" || \
                "${{ needs.pa11y-audit.result }}" != "success" ]]; then
            echo "❌ Accessibility gate FAILED — one or more jobs did not pass."
            exit 1
          fi
          echo "✅ All accessibility checks passed. PR is clear to merge."
